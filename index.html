<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Black Hole Animation 1400x400</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #020105; /* Deep space black */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Rajdhani', sans-serif;
            overflow: hidden;
        }

        .banner-container {
            width: 1400px;
            height: 400px;
            max-width: 100vw;
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(255, 255, 255, 0.05);
            background-color: #030206;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .overlay-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            text-align: center;
            pointer-events: none;
            z-index: 10;
            /* Subtle floating animation */
            animation: float 6s ease-in-out infinite;
            /* Added dark backdrop to make text pop against the bright black hole */
            background: radial-gradient(circle, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0) 70%);
            padding: 40px 100px;
            border-radius: 50%;
            /* ป้องกันการตัดขึ้นบรรทัดใหม่ */
            white-space: nowrap;
        }

        @keyframes float {
            0% { transform: translate(-50%, -50%); }
            50% { transform: translate(-50%, -54%); }
            100% { transform: translate(-50%, -50%); }
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-size: 6.5rem; /* Larger font */
            margin: 0;
            letter-spacing: 12px;
            text-transform: uppercase;
            color: #ffffff;
            white-space: nowrap;
            /* Heavy contrast text shadow to pop out */
            text-shadow: 
                0 4px 10px rgba(0, 0, 0, 1),
                0 0 20px rgba(0, 0, 0, 1),
                0 0 40px rgba(0, 0, 0, 0.9),
                0 0 30px rgba(255, 180, 100, 0.8);
        }

        p {
            font-size: 2rem;
            color: #fff0d4;
            margin-top: 10px;
            letter-spacing: 8px;
            font-weight: 700;
            white-space: nowrap;
            /* Heavy contrast text shadow for subtitle */
            text-shadow: 
                0 2px 5px rgba(0, 0, 0, 1), 
                0 0 15px rgba(0, 0, 0, 1),
                0 0 20px rgba(255, 150, 50, 0.8);
        }
    </style>
</head>
<body>

    <div class="banner-container">
        <canvas id="blackHoleCanvas"></canvas>
        <div class="overlay-text">
            <h1>Ai Lab</h1>
            <p>ANY TIME ANY WHERE</p>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('blackHoleCanvas');
        const ctx = canvas.getContext('2d');

        // Fixed resolution for crisp rendering
        const width = 1400;
        const height = 400;
        canvas.width = width;
        canvas.height = height;

        // Base coordinates for the black hole
        let cx = width / 2;
        let cy = height / 2;
        
        // Mouse parallax target
        let targetCx = width / 2;
        let targetCy = height / 2;

        // Radius of the Event Horizon (The dark sphere) ปรับให้เล็กลงจาก 75
        const eventHorizonRadius = 55;

        // Arrays to hold data
        const rings = [];
        const backgroundStars = [];
        const meteors = [];
        // Track time for animation
        let time = 0;

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const mouseX = (e.clientX - rect.left) * scaleX;
            const mouseY = (e.clientY - rect.top) * scaleY;
            
            // Subtle shift based on mouse position (Parallax)
            targetCx = (width / 2) + (mouseX - width / 2) * 0.03;
            targetCy = (height / 2) + (mouseY - height / 2) * 0.03;
        });

        canvas.addEventListener('mouseleave', () => {
            targetCx = width / 2;
            targetCy = height / 2;
        });

        // Colors from outer edge to inner edge
        const palette = [
            'rgba(80, 20, 10, 0.4)',   // Outer dark red
            'rgba(180, 60, 20, 0.5)',  // Red-orange
            'rgba(255, 120, 40, 0.7)', // Bright orange
            'rgba(255, 200, 120, 0.8)',// Peach / yellow
            'rgba(255, 240, 220, 0.9)',// Near white
            'rgba(150, 220, 255, 0.8)' // Innermost cyan edge
        ];

        function getRingColor(ratio) {
            const index = Math.min(Math.floor(ratio * palette.length), palette.length - 1);
            return palette[index];
        }

        // Generate rings for the accretion disk - ปรับขนาดไม่ให้หลุดกรอบ 400px
        const numRings = 40;
        const maxRx = 320; // ปรับรัศมีแนวนอนไม่ให้กว้างเกินไป
        const minRx = eventHorizonRadius + 5;
        const baseRy = 35; // Flatness of the disk (ปรับให้แบนลงเพื่อไม่ให้ติดขอบ)

        for (let i = 0; i < numRings; i++) {
            const ratio = i / numRings; // 0 is outer, 1 is inner
            const rx = maxRx - (maxRx - minRx) * Math.pow(ratio, 0.8);
            const ry = baseRy - (baseRy - (eventHorizonRadius * 0.2)) * ratio;
            
            rings.push({
                rx: rx,
                ry: ry,
                color: getRingColor(ratio),
                lineWidth: Math.random() * 4 + 1,
                blur: Math.random() * 10 + 2,
                dash: [Math.random() * 200 + 50, Math.random() * 100 + 20],
                speed: (Math.random() * 1.5 + 0.5) * (ratio * 3 + 1), // Inner rings spin faster
                offset: Math.random() * 1000,
                // Control points for the lensed halos (คำนวณใหม่ให้ความสูงไม่หลุดขอบ 400px)
                haloTopY: (maxRx - rx) * 0.4 + 80, 
                haloBottomY: (maxRx - rx) * 0.2 + 40
            });
        }

        for (let i = 0; i < 200; i++) {
            backgroundStars.push({
                x: Math.random() * width,
                y: Math.random() * height,
                radius: Math.random() * 1.5,
                alpha: Math.random(),
                speed: Math.random() * 0.02 + 0.01
            });
        }

        function drawBackground() {
            ctx.fillStyle = '#030108'; // Deep space color
            ctx.fillRect(0, 0, width, height);
            
            ctx.fillStyle = '#ffffff';
            backgroundStars.forEach(star => {
                // Twinkle
                star.alpha += star.speed;
                if (star.alpha > 1 || star.alpha < 0.2) star.speed *= -1;
                
                ctx.globalAlpha = Math.max(0, Math.min(1, star.alpha));
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;
        }

        function drawMeteors() {
            // Randomly spawn a new meteor (approx 3% chance per frame)
            if (Math.random() < 0.03) {
                meteors.push({
                    x: Math.random() * width * 1.5, // Start further right to angle left
                    y: Math.random() * -100, // Start above the canvas
                    length: Math.random() * 100 + 40, // Length of the tail
                    thickness: Math.random() * 1.5 + 0.5,
                    vx: -(Math.random() * 10 + 6), // Speed X (moving left)
                    vy: (Math.random() * 5 + 3),   // Speed Y (moving down)
                    opacity: 1,
                    fadeRate: Math.random() * 0.03 + 0.005, // How fast it fades out
                    // Mix of cyan and orange/white tints
                    color: Math.random() > 0.5 ? '150, 220, 255' : '255, 220, 180'
                });
            }

            ctx.globalCompositeOperation = 'screen';
            for (let i = meteors.length - 1; i >= 0; i--) {
                let m = meteors[i];
                
                // Move the meteor
                m.x += m.vx;
                m.y += m.vy;
                m.opacity -= m.fadeRate; // Fade out gradually

                if (m.opacity > 0) {
                    // Calculate tail coordinates
                    let len = Math.sqrt(m.vx * m.vx + m.vy * m.vy);
                    let dx = (m.vx / len) * m.length;
                    let dy = (m.vy / len) * m.length;
                    
                    let tailX = m.x - dx;
                    let tailY = m.y - dy;

                    // Gradient for the tail (bright at head, transparent at tail)
                    let grad = ctx.createLinearGradient(m.x, m.y, tailX, tailY);
                    grad.addColorStop(0, `rgba(${m.color}, ${m.opacity})`);
                    grad.addColorStop(1, `rgba(${m.color}, 0)`);

                    // Draw tail
                    ctx.beginPath();
                    ctx.strokeStyle = grad;
                    ctx.lineWidth = m.thickness;
                    ctx.lineCap = 'round';
                    ctx.moveTo(m.x, m.y);
                    ctx.lineTo(tailX, tailY);
                    ctx.stroke();

                    // Draw head glow
                    ctx.beginPath();
                    ctx.fillStyle = `rgba(255, 255, 255, ${m.opacity})`;
                    ctx.arc(m.x, m.y, m.thickness, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Remove meteor if it faded completely or went off-screen
                if (m.opacity <= 0 || m.y > height || m.x < -100) {
                    meteors.splice(i, 1);
                }
            }
        }

        // Draw the swirling lines
        function drawRings(part) {
            rings.forEach(ring => {
                ctx.beginPath();
                ctx.strokeStyle = ring.color;
                ctx.lineWidth = ring.lineWidth;
                ctx.filter = `blur(${ring.blur}px)`;
                ctx.setLineDash(ring.dash);
                ctx.lineDashOffset = -time * ring.speed - ring.offset;

                if (part === 'back') {
                    // Back half of the disk (behind event horizon)
                    ctx.ellipse(cx, cy, ring.rx, ring.ry, 0, Math.PI, Math.PI * 2);
                    ctx.stroke();
                } 
                else if (part === 'front') {
                    // Front half of the disk (overlaps event horizon)
                    ctx.ellipse(cx, cy, ring.rx, ring.ry, 0, 0, Math.PI);
                    ctx.stroke();
                }
                else if (part === 'haloTop') {
                    // Gravitational Lensing (warped over the top)
                    // Only draw for rings that are slightly further out
                    if (ring.rx > eventHorizonRadius * 1.5) {
                        ctx.moveTo(cx - ring.rx, cy);
                        // Bezier curve arching upwards
                        ctx.bezierCurveTo(
                            cx - ring.rx * 0.4, cy - ring.haloTopY, 
                            cx + ring.rx * 0.4, cy - ring.haloTopY, 
                            cx + ring.rx, cy
                        );
                        ctx.stroke();
                    }
                }
                else if (part === 'haloBottom') {
                    // Gravitational Lensing (warped under the bottom, much thinner/fainter)
                    if (ring.rx > eventHorizonRadius * 1.8) {
                        ctx.moveTo(cx - ring.rx, cy);
                        ctx.bezierCurveTo(
                            cx - ring.rx * 0.5, cy + ring.haloBottomY, 
                            cx + ring.rx * 0.5, cy + ring.haloBottomY, 
                            cx + ring.rx, cy
                        );
                        ctx.globalAlpha = 0.5; // Make bottom halo fainter
                        ctx.stroke();
                        ctx.globalAlpha = 1.0;
                    }
                }
            });
        }

        function drawEventHorizon() {
            ctx.filter = 'none'; // Clear blur for the sharp event horizon
            ctx.setLineDash([]); // Clear dash
            
            // The black sphere
            ctx.beginPath();
            ctx.arc(cx, cy, eventHorizonRadius, 0, Math.PI * 2);
            ctx.fillStyle = '#000000';
            ctx.fill();

            // Photon ring (thin bright rim just inside/outside the black hole)
            ctx.beginPath();
            ctx.arc(cx, cy, eventHorizonRadius + 1, 0, Math.PI * 2);
            ctx.lineWidth = 1.5;
            ctx.strokeStyle = 'rgba(150, 220, 255, 0.5)'; // Cyan rim
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#96dcff';
            ctx.stroke();
            
            // Reset shadows
            ctx.shadowBlur = 0;
        }

        function animate() {
            time += 0.5;

            // Smooth parallax translation
            cx += (targetCx - cx) * 0.05;
            cy += (targetCy - cy) * 0.05;

            // 1. Draw Space Background
            ctx.globalCompositeOperation = 'source-over';
            ctx.filter = 'none';
            drawBackground();
            
            // Draw Meteor Shower
            drawMeteors();

            // 2. Draw Background Plasma (Additive blending for glow)
            ctx.globalCompositeOperation = 'screen';
            
            // Lensed halos
            drawRings('haloTop');
            drawRings('haloBottom');
            
            // Back half of the accretion disk
            drawRings('back');

            // 3. Draw Event Horizon (Normal blending to cover the back plasma)
            ctx.globalCompositeOperation = 'source-over';
            drawEventHorizon();

            // 4. Draw Foreground Plasma (Overlaps the Event Horizon)
            ctx.globalCompositeOperation = 'screen';
            drawRings('front');

            requestAnimationFrame(animate);
        }

        // Start the engine
        window.onload = () => {
            animate();
        };
    </script>
</body>
</html>

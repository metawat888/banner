<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ai Lab Interactive Banner</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #020202;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-family: 'archTH', sans-serif;
        }

        /* Responsive wrapper to maintain 1400x400 aspect ratio */
        .scale-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100vw;
            height: 100vh;
        }

        .banner-container {
            width: 1400px;
            height: 400px;
            background: #050914; /* Deep dark blue/black */
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0, 150, 255, 0.1), inset 0 0 100px #000;
            border: 1px solid rgba(0, 255, 255, 0.2);
            border-radius: 12px;
            cursor: crosshair; /* Indicate interactivity */
        }

        #interactive-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .content-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none; /* Let mouse events pass through to the canvas */
        }

        .title {
            font-family: 'archTH', sans-serif;
            font-size: 85px;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 15px;
            color: #ffffff;
            /* Reduced glow for better readability */
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.3), 0 0 20px rgba(0, 100, 255, 0.2);
            background: linear-gradient(180deg, #ffffff 0%, #a2c2e8 40%, #4b6cb7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            /* Added a darker drop shadow to separate text from the bright canvas */
            filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.9));
        }

        .subtitle {
            font-family: 'archTH', sans-serif;
            font-weight: 700;
            font-size: 22px;
            margin-top: 15px;
            text-transform: uppercase;
            letter-spacing: 12px;
            color: #00ffff;
            /* Reduced glow */
            text-shadow: 0 0 5px rgba(0, 255, 255, 0.4), 0 0 10px rgba(0, 255, 255, 0.2);
            opacity: 0.9;
        }

    </style>
</head>
<body>

    <div class="scale-wrapper" id="scaleWrapper">
        <div class="banner-container">
            <!-- The interactive canvas background -->
            <canvas id="interactive-canvas"></canvas>
            
            <!-- Foreground text overlay -->
            <div class="content-layer">
                <h1 class="title">Ai Lab</h1>
                <h2 class="subtitle">Any time Any Where</h2>
            </div>
        </div>
    </div>

    <script>
        const banner = document.querySelector('.banner-container');
        
        function resizeBanner() {
            const windowWidth = window.innerWidth;
            const windowHeight = window.innerHeight;
            
            // Calculate scale to fit within screen (95% of screen size max)
            const scaleX = (windowWidth * 0.95) / 1400;
            const scaleY = (windowHeight * 0.95) / 400;
            const scale = Math.min(scaleX, scaleY, 1);
            
            banner.style.transform = `scale(${scale})`;
        }

        window.addEventListener('resize', resizeBanner);
        resizeBanner(); // Trigger on load

        const canvas = document.getElementById('interactive-canvas');
        const ctx = canvas.getContext('2d');
        
        // Match actual banner size
        canvas.width = 1400;
        canvas.height = 400;

        let particlesArray = [];
        
        // Mouse object to store coordinates and interaction radius
        let mouse = {
            x: null,
            y: null,
            radius: 200 // The area of effect for the intense highlighting
        };

        // Calculate exact mouse position relative to the scaled canvas
        function updateMousePosition(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            // Calculate actual scale of the element
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            
            mouse.x = (clientX - rect.left) * scaleX;
            mouse.y = (clientY - rect.top) * scaleY;
        }

        window.addEventListener('mousemove', (event) => {
            updateMousePosition(event.clientX, event.clientY);
        });

        window.addEventListener('touchmove', (event) => {
            if(event.touches.length > 0) {
                updateMousePosition(event.touches[0].clientX, event.touches[0].clientY);
            }
        });

        window.addEventListener('touchstart', (event) => {
            if(event.touches.length > 0) {
                updateMousePosition(event.touches[0].clientX, event.touches[0].clientY);
            }
        });

        // Reset mouse position when leaving the area or ending touch
        window.addEventListener('mouseout', () => {
            mouse.x = undefined;
            mouse.y = undefined;
        });

        window.addEventListener('touchend', () => {
            mouse.x = undefined;
            mouse.y = undefined;
        });

        window.addEventListener('touchcancel', () => {
            mouse.x = undefined;
            mouse.y = undefined;
        });

        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = Math.random() * 2 + 1; // Base node size
                // Slower, smoother movement
                this.baseX = this.x;
                this.baseY = this.y;
                this.density = (Math.random() * 30) + 1;
                // Velocity for drifting
                this.vx = (Math.random() - 0.5) * 0.5;
                this.vy = (Math.random() - 0.5) * 0.5;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.closePath();
                ctx.fill();
            }

            update() {
                // Keep particles moving slowly
                this.x += this.vx;
                this.y += this.vy;

                // Bounce off edges
                if (this.x < 0 || this.x > canvas.width) this.vx = -this.vx;
                if (this.y < 0 || this.y > canvas.height) this.vy = -this.vy;

                // Mouse interaction for nodes (Push effect and glow)
                let dx = mouse.x - this.x;
                let dy = mouse.y - this.y;
                let distance = Math.hypot(dx, dy);

                if (distance < mouse.radius) {
                    // Node gets brighter and slightly larger when mouse is near
                    ctx.fillStyle = `rgba(0, 255, 255, 1)`;
                    this.size = 3; 
                } else {
                    // Default faint state
                    ctx.fillStyle = `rgba(100, 150, 255, 0.3)`;
                    this.size = 1.5;
                }

                this.draw();
            }
        }

        function init() {
            particlesArray = [];
            // Amount of nodes (density of the pattern)
            let numberOfParticles = 250;
            for (let i = 0; i < numberOfParticles; i++) {
                let x = Math.random() * canvas.width;
                let y = Math.random() * canvas.height;
                particlesArray.push(new Particle(x, y));
            }
        }

        function connect() {
            let maxDistance = 80; // Distance to form a connection line
            
            for (let a = 0; a < particlesArray.length; a++) {
                for (let b = a; b < particlesArray.length; b++) {
                    let dx = particlesArray[a].x - particlesArray[b].x;
                    let dy = particlesArray[a].y - particlesArray[b].y;
                    let distance = Math.hypot(dx, dy);

                    if (distance < maxDistance) {
                        // Check if this specific line is near the mouse
                        let midX = (particlesArray[a].x + particlesArray[b].x) / 2;
                        let midY = (particlesArray[a].y + particlesArray[b].y) / 2;
                        
                        let mouseDx = mouse.x - midX;
                        let mouseDy = mouse.y - midY;
                        let mouseDistance = Math.hypot(mouseDx, mouseDy);

                        // If the line is within the mouse radius, make it intense (เข้มขึ้น)
                        if (mouseDistance < mouse.radius) {
                            // Calculate intensity based on how close the mouse is
                            let intensity = 1 - (mouseDistance / mouse.radius);
                            
                            ctx.strokeStyle = `rgba(0, 255, 255, ${intensity})`; // Bright cyan
                            ctx.lineWidth = intensity * 2.5; // Thicker lines near mouse
                        } else {
                            // Default faint background pattern
                            let opacityValue = 1 - (distance / maxDistance);
                            ctx.strokeStyle = `rgba(75, 120, 200, ${opacityValue * 0.15})`; // Faint blue/grey
                            ctx.lineWidth = 0.5; // Thin lines normally
                        }

                        ctx.beginPath();
                        ctx.moveTo(particlesArray[a].x, particlesArray[a].y);
                        ctx.lineTo(particlesArray[b].x, particlesArray[b].y);
                        ctx.stroke();
                    }
                }
            }
        }

        function animate() {
            // Clear canvas with a very slight trail effect
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
            }
            connect();
            requestAnimationFrame(animate);
        }

        // Initialize and start
        window.onload = () => {
            init();
            animate();
        };

    </script>
</body>
</html>

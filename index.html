<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ai Lab Interactive Banner</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #020202;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-family: 'archTH', sans-serif;
        }

        .scale-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100vw;
            height: 100vh;
        }

        .banner-container {
            width: 1400px;
            height: 400px;
            background-color: #050914; /* Deep dark blue/black base */
            /* Adding the Sci-Fi Grid Background */
            background-image: 
                linear-gradient(rgba(0, 255, 255, 0.07) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.07) 1px, transparent 1px);
            background-size: 40px 40px; /* Grid size */
            background-position: center center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0, 150, 255, 0.1), inset 0 0 80px #000;
            /* Removed border as requested */
            border: none;
            border-radius: 12px;
            cursor: crosshair; /* Indicate interactivity */
        }

        #interactive-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .content-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none; /* Let mouse/touch events pass through to the canvas */
        }

        .title {
            font-family: 'archTH', sans-serif;
            font-size: 65px; /* Reduced size */
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 12px;
            color: #ffffff;
            /* Reduced glow for better readability */
            text-shadow: 0 0 8px rgba(0, 255, 255, 0.4), 0 0 15px rgba(0, 100, 255, 0.3);
            background: linear-gradient(180deg, #ffffff 0%, #c4dcf5 50%, #4b6cb7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.8));
        }

        .subtitle {
            font-family: 'archTH', sans-serif;
            font-weight: 700;
            font-size: 18px; /* Reduced size */
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 8px;
            color: #00ffff;
            /* Reduced glow */
            text-shadow: 0 0 5px rgba(0, 255, 255, 0.3);
            opacity: 0.85;
        }
    </style>
</head>
<body>

    <div class="scale-wrapper" id="scaleWrapper">
        <div class="banner-container">
            <!-- The interactive canvas background -->
            <canvas id="interactive-canvas"></canvas>
            
            <!-- Foreground text overlay -->
            <div class="content-layer">
                <h1 class="title">Ai Lab</h1>
                <h2 class="subtitle">Any time Any Where</h2>
            </div>
        </div>
    </div>

    <script>
        const banner = document.querySelector('.banner-container');
        const canvas = document.getElementById('interactive-canvas');
        const ctx = canvas.getContext('2d');
        
        // Exact 1400x400 size for the internal canvas logic
        const CANVAS_WIDTH = 1400;
        const CANVAS_HEIGHT = 400;
        
        canvas.width = CANVAS_WIDTH;
        canvas.height = CANVAS_HEIGHT;

        function resizeBanner() {
            const windowWidth = window.innerWidth;
            const windowHeight = window.innerHeight;
            
            // Calculate scale to fit within screen (95% of screen size max to leave a tiny margin)
            const scaleX = (windowWidth * 0.95) / CANVAS_WIDTH;
            const scaleY = (windowHeight * 0.95) / CANVAS_HEIGHT;
            const scale = Math.min(scaleX, scaleY, 1); // Max scale is 1 (100%)
            
            banner.style.transform = `scale(${scale})`;
        }

        window.addEventListener('resize', resizeBanner);
        resizeBanner(); // Trigger calculation on load

        let particlesArray = [];
        
        // Mouse and autonomous wandering light state
        let mouse = {
            x: null,
            y: null,
            radius: 180, // Interaction radius
            isUserActive: false
        };

        // Autonomous wandering light parameters
        let wanderX = CANVAS_WIDTH / 2;
        let wanderY = CANVAS_HEIGHT / 2;
        let wanderAngleX = Math.random() * Math.PI * 2;
        let wanderAngleY = Math.random() * Math.PI * 2;
        let wanderSpeedX = 1.5;
        let wanderSpeedY = 1.2;

        function updateMousePosition(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            
            mouse.x = (clientX - rect.left) * scaleX;
            mouse.y = (clientY - rect.top) * scaleY;
            mouse.isUserActive = true;
        }

        // Mouse Events
        window.addEventListener('mousemove', (event) => {
            updateMousePosition(event.clientX, event.clientY);
        });
        window.addEventListener('mouseout', () => {
            mouse.isUserActive = false;
        });

        // Touch Events for Mobile / iPad
        window.addEventListener('touchmove', (event) => {
            if(event.touches.length > 0) {
                updateMousePosition(event.touches[0].clientX, event.touches[0].clientY);
            }
        });
        window.addEventListener('touchstart', (event) => {
            if(event.touches.length > 0) {
                updateMousePosition(event.touches[0].clientX, event.touches[0].clientY);
            }
        });
        window.addEventListener('touchend', () => {
            mouse.isUserActive = false;
        });
        window.addEventListener('touchcancel', () => {
            mouse.isUserActive = false;
        });

        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = Math.random() * 1.5 + 0.5; // Base node size
                // Smooth drifting velocity
                this.vx = (Math.random() - 0.5) * 0.8;
                this.vy = (Math.random() - 0.5) * 0.8;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.closePath();
                ctx.fill();
            }

            update() {
                // Move particle
                this.x += this.vx;
                this.y += this.vy;

                // Wrap-around edges for seamless continuous flowing
                if (this.x < 0) this.x = canvas.width;
                if (this.x > canvas.width) this.x = 0;
                if (this.y < 0) this.y = canvas.height;
                if (this.y > canvas.height) this.y = 0;

                // Determine active light position (User or Autonomous Wandering Light)
                let activeX = mouse.isUserActive ? mouse.x : wanderX;
                let activeY = mouse.isUserActive ? mouse.y : wanderY;

                // Interaction with active light source
                let dx = activeX - this.x;
                let dy = activeY - this.y;
                let distance = Math.hypot(dx, dy);

                if (distance < mouse.radius) {
                    ctx.fillStyle = `rgba(0, 255, 255, 1)`; // Bright cyan when near light
                    this.size = 2.5; 
                } else {
                    ctx.fillStyle = `rgba(100, 150, 255, 0.4)`; // Faint default
                    this.size = 1.2;
                }

                this.draw();
            }
        }

        function init() {
            particlesArray = [];
            let numberOfParticles = 220; // Appropriate density for 1400x400
            for (let i = 0; i < numberOfParticles; i++) {
                let x = Math.random() * canvas.width;
                let y = Math.random() * canvas.height;
                particlesArray.push(new Particle(x, y));
            }
        }

        function connect() {
            let maxDistance = 75; // Distance to draw a line
            
            // Determine active light position
            let activeX = mouse.isUserActive ? mouse.x : wanderX;
            let activeY = mouse.isUserActive ? mouse.y : wanderY;

            for (let a = 0; a < particlesArray.length; a++) {
                for (let b = a; b < particlesArray.length; b++) {
                    let dx = particlesArray[a].x - particlesArray[b].x;
                    let dy = particlesArray[a].y - particlesArray[b].y;
                    let distance = Math.hypot(dx, dy);

                    if (distance < maxDistance) {
                        let isNearLight = false;
                        let intensity = 0;

                        let midX = (particlesArray[a].x + particlesArray[b].x) / 2;
                        let midY = (particlesArray[a].y + particlesArray[b].y) / 2;
                        let lightDistance = Math.hypot(activeX - midX, activeY - midY);

                        if (lightDistance < mouse.radius) {
                            isNearLight = true;
                            intensity = 1 - (lightDistance / mouse.radius);
                        }

                        if (isNearLight) {
                            ctx.strokeStyle = `rgba(0, 255, 255, ${intensity * 0.8})`; 
                            ctx.lineWidth = intensity * 2.0; 
                        } else {
                            let opacityValue = 1 - (distance / maxDistance);
                            ctx.strokeStyle = `rgba(75, 120, 200, ${opacityValue * 0.15})`; 
                            ctx.lineWidth = 0.5; 
                        }

                        ctx.beginPath();
                        ctx.moveTo(particlesArray[a].x, particlesArray[a].y);
                        ctx.lineTo(particlesArray[b].x, particlesArray[b].y);
                        ctx.stroke();
                    }
                }
            }
        }

        function updateWanderingLight() {
            if (!mouse.isUserActive) {
                // Smooth organic wandering path using sine waves
                wanderAngleX += 0.02;
                wanderAngleY += 0.015;

                wanderX = (CANVAS_WIDTH / 2) + Math.sin(wanderAngleX) * (CANVAS_WIDTH * 0.42);
                wanderY = (CANVAS_HEIGHT / 2) + Math.cos(wanderAngleY) * (CANVAS_HEIGHT * 0.35);
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            updateWanderingLight();

            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
            }
            connect();
            requestAnimationFrame(animate);
        }

        // Start everything securely
        window.onload = () => {
            try {
                init();
                animate();
            } catch (error) {
                console.error("Animation Error:", error);
            }
        };
    </script>
</body>
</html>
